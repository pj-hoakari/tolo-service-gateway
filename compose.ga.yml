services:
    graph-authoring:
        build:
            context: https://github.com/pj-hoakari/tolo-graph-authoring.git#10c17cbab0cad12916c6740eb15f1e08eb1c80aa
        environment:
            SERVER_ADDR: :8080
            DATABASE_URL: postgres://graph-authoring-db:5432/graph_authoring?sslmode=disable&user=graph_authoring&password=${TOLO_GA_DB_PASSWORD:-graph_authoring}
            INTERNAL_JWKS_URL: http://server:8080/.well-known/jwks.json
            INTERNAL_JWT_ISSUER: service-gateway
            INTERNAL_JWT_AUDIENCE: tolo-graph-authoring
            TENANT_MANAGEMENT_URL: http://server:8090
        depends_on:
            graph-authoring-migrate:
                condition: service_completed_successfully
            server:
                condition: service_started

    graph-authoring-migrate:
        build:
            context: https://github.com/pj-hoakari/tolo-graph-authoring.git#10c17cbab0cad12916c6740eb15f1e08eb1c80aa
            target: migrate
        command:
            - -database
            - postgres://graph-authoring-db:5432/graph_authoring?sslmode=disable&user=graph_authoring&password=${TOLO_GA_DB_PASSWORD:-graph_authoring}
            - up
        depends_on:
            graph-authoring-db:
                condition: service_healthy
        restart: "no"

    graph-authoring-db:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        environment:
            POSTGRES_DB: graph_authoring
            POSTGRES_USER: graph_authoring
            POSTGRES_PASSWORD: ${TOLO_GA_DB_PASSWORD:-graph_authoring}
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 5s
        volumes:
            - graph-authoring-data:/var/lib/postgresql

volumes:
    graph-authoring-data:

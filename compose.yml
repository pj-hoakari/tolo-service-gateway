services:
    server:
        build:
            context: .
        environment:
            SERVER_ADDR: :8080
            INTERNAL_JWT_ISSUER: service-gateway
            INTERNAL_JWT_SIGNING_KEY_FILE: /etc/tolo/signing-key.pem
            INTERNAL_JWT_SIGNING_KEY_ID: dev-key-1
        ports:
            - "8080:8080"

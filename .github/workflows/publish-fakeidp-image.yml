name: Publish fakeidp Image

on:
    workflow_dispatch:
        inputs:
            version:
                description: "公開するバージョン（vX.Y.Z または vX.Y.Z-suffix）"
                required: true
                type: string

permissions:
    contents: read
    packages: write

jobs:
    build-and-push:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Build and push
              uses: pj-hoakari/actions/publish-image@e0ffe48f766307783a545c33bc29d58362094572 # v20261113.0.0
              with:
                  version: ${{ inputs.version }}
                  image: ghcr.io/pj-hoakari/tolo-fakeidp
                  target: fakeidp
                  cache-scope: fakeidp

name: Publish Docker Image

on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            version:
                description: "公開するバージョン（vX.Y.Z または vX.Y.Z-suffix）"
                required: false
                type: string

permissions:
    contents: read
    packages: write
    id-token: write

jobs:
    build-and-push:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Resolve version
              id: version
              uses: pj-hoakari/actions/resolve-version@e5cc4b20767674fe5af61af03625d778f7ec3acf # v20261013.0.0
              with:
                  version: ${{ inputs.version }}

            - name: Build and push
              uses: pj-hoakari/actions/publish-image@e5cc4b20767674fe5af61af03625d778f7ec3acf # v20261013.0.0
              with:
                  version: ${{ steps.version.outputs.version }}

services:
    keygen:
        image: alpine/openssl:3.5.8@sha256:6aa2be0ed55a61fff35583e5763c2ea8288bcd3549d316b954b01eec32fb7006
        entrypoint: ["/bin/sh", "-c"]
        command:
            - |
              set -eu
              if [ ! -f /keys/signing-key.pem ]; then
                openssl ecparam -name prime256v1 -genkey -noout -out /keys/signing-key.pem
                chown 65532:65532 /keys/signing-key.pem
                chmod 0400 /keys/signing-key.pem
              fi
              if [ ! -f /idp/introspection-client-secret ]; then
                openssl rand -hex 16 > /idp/introspection-client-secret
                chown 65532:65532 /idp/introspection-client-secret
                chmod 0400 /idp/introspection-client-secret
              fi
        volumes:
            - internal-jwt-keys:/keys
            - idp-introspection:/idp
        restart: "no"

    server:
        build:
            context: .
            target: server
        environment:
            SERVER_ADDR: :8080
            INTERNAL_JWT_ISSUER: service-gateway
            INTERNAL_JWT_SIGNING_KEY_FILE: /etc/tolo/keys/signing-key.pem
            INTERNAL_JWT_SIGNING_KEY_ID: dev-key-1
            TOLO_GATEWAY_DESTINATIONS_FILE: /etc/tolo/gateway/destinations.json
            IDP_ISSUER: http://fakeidp:8080
            IDP_AUDIENCE: backend-api
            IDP_INTROSPECTION_CLIENT_ID: gateway-introspection
            IDP_INTROSPECTION_CLIENT_SECRET_FILE: /etc/tolo/idp/introspection-client-secret
        ports:
            - "8080:8080"
        volumes:
            - internal-jwt-keys:/etc/tolo/keys:ro
            - idp-introspection:/etc/tolo/idp:ro
            - ./config/compose/destinations.json:/etc/tolo/gateway/destinations.json:ro
        depends_on:
            keygen:
                condition: service_completed_successfully
            fakeidp:
                condition: service_started

    fakeidp:
        build:
            context: .
            target: fakeidp
        environment:
            SERVER_ADDR: :8080
            FAKE_IDP_ISSUER: http://fakeidp:8080
            FAKE_IDP_AUDIENCE: backend-api
            FAKE_IDP_INTROSPECTION_CLIENT_ID: gateway-introspection
            FAKE_IDP_INTROSPECTION_CLIENT_SECRET_FILE: /etc/tolo/idp/introspection-client-secret
        ports:
            - "8082:8080"
        volumes:
            - idp-introspection:/etc/tolo/idp:ro
        depends_on:
            keygen:
                condition: service_completed_successfully

    testbackend:
        build:
            context: .
            target: testbackend
        environment:
            SERVER_ADDR: :8080
            INTERNAL_JWKS_URL: http://server:8080/.well-known/jwks.json
            INTERNAL_JWT_ISSUER: service-gateway
            INTERNAL_JWT_AUDIENCE: tolo-testbackend
        ports:
            - "8081:8080"
        depends_on:
            server:
                condition: service_started

volumes:
    internal-jwt-keys:
    idp-introspection:

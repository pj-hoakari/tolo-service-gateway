name: Test

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: Detect changes
              id: changes
              uses: pj-hoakari/actions/detect-changes@92b346752a66ad19a36fbc929191603f72e00fe9 # v20261020.0.2
              with:
                  paths: |
                      **/*.go
                      go.mod
                      go.sum
                      go.work
                      go.work.sum
                      tolo-observation.ref
                      .github/workflows/test.yml

            - name: Read pinned tolo-observation commit
              id: observation
              if: steps.changes.outputs.changed == 'true'
              run: echo "ref=$(cat tolo-observation.ref)" >> "${GITHUB_OUTPUT}"

            - name: Checkout tolo-observation
              if: steps.changes.outputs.changed == 'true'
              env:
                  TOLO_OBSERVATION_REF: ${{ vars.TOLO_OBSERVATION_REF || steps.observation.outputs.ref }}
              run: |
                  git init ../tolo-observation
                  git -C ../tolo-observation remote add origin https://github.com/pj-hoakari/tolo-observation.git
                  git -C ../tolo-observation fetch --depth 1 origin "${TOLO_OBSERVATION_REF}"
                  git -C ../tolo-observation checkout --detach FETCH_HEAD

            - name: Set up Go
              if: steps.changes.outputs.changed == 'true'
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Run tests
              if: steps.changes.outputs.changed == 'true'
              run: go test ./...

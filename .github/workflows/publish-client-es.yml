name: Publish connect-es Client

on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            version:
                description: "公開するバージョン（vX.Y.Z または vX.Y.Z-suffix）"
                required: false
                type: string

permissions:
    contents: read
    packages: write

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
                  registry-url: https://npm.pkg.github.com
                  scope: "@pj-hoakari"

            - name: Publish connect-es client
              uses: pj-hoakari/actions/publish-client-es@3cf99dacd5f2b5135f15ce80118d9647dbae6a2d # v20261002
              with:
                  version: ${{ inputs.version }}

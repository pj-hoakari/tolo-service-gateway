name: Publish Preview Image

on:
    workflow_dispatch:
        inputs:
            pull-request:
                description: "イメージを公開するプルリクエストの番号"
                required: true
                type: number
    workflow_call:
        inputs:
            pull-request:
                description: "イメージを公開するプルリクエストの番号"
                required: true
                type: number

permissions:
    contents: read
    packages: write
    pull-requests: read

jobs:
    build-and-push:
        runs-on: ubuntu-latest

        steps:
            - name: Resolve pull request head
              id: pr
              uses: pj-hoakari/actions/pull-request-head@a753f5b7b0efae839bd92d283fca39401471a4b2 # v20261020.0.0
              with:
                  number: ${{ inputs.pull-request }}

            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ steps.pr.outputs.sha }}

            - name: Build and push
              uses: pj-hoakari/actions/publish-image@a753f5b7b0efae839bd92d283fca39401471a4b2 # v20261020.0.0
              with:
                  sha: ${{ steps.pr.outputs.sha }}
                  platforms: linux/amd64

            - name: Build and push (fakeidp)
              uses: pj-hoakari/actions/publish-image@a753f5b7b0efae839bd92d283fca39401471a4b2 # v20261020.0.0
              with:
                  sha: ${{ steps.pr.outputs.sha }}
                  platforms: linux/amd64
                  image: ghcr.io/pj-hoakari/tolo-fakeidp
                  target: fakeidp
                  cache-scope: fakeidp

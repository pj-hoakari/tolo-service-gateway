name: Publish Proto Artifact

on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            version:
                description: "公開するバージョン（vX.Y.Z または vX.Y.Z-suffix）"
                required: false
                type: string

permissions:
    contents: read
    packages: write

jobs:
    publish:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Resolve version and tags
              id: version
              uses: pj-hoakari/actions/resolve-version@e5cc4b20767674fe5af61af03625d778f7ec3acf # v20261013.0.0
              with:
                  version: ${{ inputs.version }}

            - name: Push proto artifact
              uses: pj-hoakari/actions/publish-proto@e5cc4b20767674fe5af61af03625d778f7ec3acf # v20261013.0.0
              with:
                  version: ${{ steps.version.outputs.version }}
                  tags: ${{ steps.version.outputs.tags }}

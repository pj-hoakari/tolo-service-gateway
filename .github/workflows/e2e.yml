name: E2E

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    e2e:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: Detect changes
              id: changes
              uses: pj-hoakari/actions/detect-changes@92b346752a66ad19a36fbc929191603f72e00fe9 # v20261020.0.2
              with:
                  paths: |
                      **/*.go
                      go.mod
                      go.sum
                      go.work
                      go.work.sum
                      tolo-observation.ref
                      Dockerfile
                      compose.yml
                      config/compose/**
                      scripts/dev/**
                      .github/workflows/e2e.yml

            - name: Read pinned tolo-observation commit
              id: observation
              if: steps.changes.outputs.changed == 'true'
              run: echo "ref=$(cat tolo-observation.ref)" >> "${GITHUB_OUTPUT}"

            - name: Checkout tolo-observation
              if: steps.changes.outputs.changed == 'true'
              env:
                  TOLO_OBSERVATION_REF: ${{ vars.TOLO_OBSERVATION_REF || steps.observation.outputs.ref }}
              run: |
                  git init ../tolo-observation
                  git -C ../tolo-observation remote add origin https://github.com/pj-hoakari/tolo-observation.git
                  git -C ../tolo-observation fetch --depth 1 origin "${TOLO_OBSERVATION_REF}"
                  git -C ../tolo-observation checkout --detach FETCH_HEAD

            - name: Verify the observation build context is required
              if: steps.changes.outputs.changed == 'true'
              run: ./scripts/dev/check-docker-observation-context.sh

            - name: Start services
              id: up
              if: steps.changes.outputs.changed == 'true'
              run: docker compose up -d --build

            - name: Wait for the gateway
              if: steps.changes.outputs.changed == 'true'
              run: |
                  set -euo pipefail
                  for i in $(seq 1 60); do
                    if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/readyz || true)" = "200" ]; then
                      echo "ready after ${i} attempts"
                      exit 0
                    fi
                    sleep 2
                  done
                  echo "::error::Service Gateway が準備完了になりません"
                  exit 1

            - name: Verify the gateway wiring
              if: steps.changes.outputs.changed == 'true'
              run: ./scripts/dev/gateway-wiring-check.sh

            - name: Verify the network reachability
              if: steps.changes.outputs.changed == 'true'
              run: ./scripts/dev/compose-reachability-check.sh

            - name: Verify no token appears in the gateway log
              if: steps.changes.outputs.changed == 'true'
              run: |
                  set -euo pipefail
                  if docker compose logs --no-color server | grep -nE 'eyJ[A-Za-z0-9_-]{20,}'; then
                    echo "::error::Gateway のログにトークンらしき文字列があります"
                    exit 1
                  fi

            - name: Dump service logs
              if: failure() && (steps.up.outcome == 'success' || steps.up.outcome == 'failure')
              run: docker compose logs --no-color

            - name: Stop services
              if: always() && (steps.up.outcome == 'success' || steps.up.outcome == 'failure')
              run: docker compose down -v

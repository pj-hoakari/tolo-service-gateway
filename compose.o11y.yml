# 監視 (observability) スタック用のオーバーライド
# ベースに重ねて使う:
#   docker compose -f compose.yml -f compose.o11y.yml up --build
services:
    jaeger:
        image: jaegertracing/jaeger:2.21.0@sha256:3d0ac795ff98aa04d1be04311d2dac6c25b4bfc8322dc02e53bc5b170c5018c3
        ports:
            - "16686:16686" # Jaeger UI
            - "4317:4317" # OTLP gRPC
            - "4318:4318" # OTLP HTTP

    server:
        environment:
            OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
            OTEL_SERVICE_NAME: tolo-service-gateway
        depends_on:
            jaeger:
                condition: service_started

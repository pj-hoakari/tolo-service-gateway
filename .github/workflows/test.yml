name: Test

on:
    pull_request:
    push:
        branches: [main, with-db]
    workflow_call:
        inputs:
            ref:
                description: Checkout target (default is the triggering commit)
                type: string
                required: false
                default: ""

permissions:
    contents: read

jobs:
    changes:
        runs-on: ubuntu-latest
        if: github.event_name == 'pull_request'
        outputs:
            run: ${{ steps.changes.outputs.run }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: Detect test-related changes
              id: changes
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: |
                  if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- '**/*.go' go.mod go.sum .github/workflows/test.yml; then
                    echo "run=false" >> "$GITHUB_OUTPUT"
                  else
                    echo "run=true" >> "$GITHUB_OUTPUT"
                  fi

    test:
        needs: changes
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.run == 'true') }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ inputs.ref }}

            - name: Set up Go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Run tests
              run: go test ./...

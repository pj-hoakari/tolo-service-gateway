name: Publish connect-es Client

on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            version:
                description: "公開するバージョン（vX.Y.Z または vX.Y.Z-suffix）"
                required: false
                type: string

permissions:
    contents: read
    packages: write

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  registry-url: https://npm.pkg.github.com
                  scope: "@pj-hoakari"

            - name: Publish connect-es client
              uses: pj-hoakari/actions/publish-client-es@d5a03071134d13698e42b2afbf9ae1761ea64ca6 # v20261017.0.0
              with:
                  version: ${{ inputs.version }}

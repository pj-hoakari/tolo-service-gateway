# 監視 (observability) スタック用のオーバーライド
# ベースに重ねて使う:
#   docker compose -f compose.yml -f compose.o11y.yml up --build
services:
    jaeger:
        image: jaegertracing/jaeger:2.20.0@sha256:46a886260e04002d8f45e213fc39063fa11a50446048fdaa64786fc0840cb9f8
        ports:
            - "16686:16686" # Jaeger UI
            - "4317:4317" # OTLP gRPC
            - "4318:4318" # OTLP HTTP

    server:
        environment:
            OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
            OTEL_SERVICE_NAME: go-service-template
        depends_on:
            jaeger:
                condition: service_started
